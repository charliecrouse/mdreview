name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: make bootstrap
      - name: Tag must match the project version
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match project.yml version $version" >&2; exit 1; }
      - run: make app
      - run: ditto -c -k --keepParent build/mdreview.app mdreview.zip
      - run: gh release create "$GITHUB_REF_NAME" mdreview.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
