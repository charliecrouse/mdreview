name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4

  # Tags made with GITHUB_TOKEN start no other workflow, so the build runs here, once the release exists.
  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - run: make bootstrap
      - name: Tag must match the project version
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: "\([^"]*\)".*/\1/p' project.yml)
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match project.yml version $version" >&2; exit 1; }
      - run: make app
      - run: |
          ditto -c -k --keepParent build/mdreview.app mdreview.zip
          shasum -a 256 mdreview.zip > mdreview.zip.sha256
      - run: gh release upload "$TAG" mdreview.zip mdreview.zip.sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
